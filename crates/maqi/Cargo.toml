[package]
name = "maqi"
version = "0.1.0"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
edition = "2024"
description = "A shell reimagined for the AI era."
repository = "https://github.com/ynqa/maqi"
# homepage = "https://maqi.ynqa.dev"
license = "MIT"
readme = "../../README.md"
publish = false

[[bin]]
name = "maqi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
andiron = { path = "../andiron" }
usage-lib = { version = "6.11.1", default-features = false }

[dev-dependencies]
termharness = "0.4.0"
